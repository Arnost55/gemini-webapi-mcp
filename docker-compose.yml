services:
  gemini-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
      # Publish this through a local reverse proxy. Raw VNC stays internal.
      - "127.0.0.1:6080:6080"
    volumes:
      - gemini-state:/var/lib/gemini-mcp
    secrets:
      - gemini_registry_key
    environment:
      GEMINI_REGISTRY_PATH: /var/lib/gemini-mcp/registry.json.enc
      GEMINI_REGISTRY_KEY_FILE: /run/secrets/gemini_registry_key
      # Encrypt durable DCR clients and bearer tokens with the same mounted key.
      GEMINI_OAUTH_STATE_KEY_FILE: /run/secrets/gemini_registry_key
      GEMINI_PUBLIC_URL: https://gemini.proxmoxserver.dev
      GEMINI_PROFILE_ROOT: /var/lib/gemini-mcp/accounts
      GEMINI_HANDOFF_ROOT: /var/lib/gemini-mcp/handoffs
      # Serve this host through the reverse proxy to port 6080 only.
      GEMINI_NOVNC_PUBLIC_URL: https://vnc.gemini.proxmoxserver.dev/vnc.html
      GEMINI_NOVNC_PORT: 6080
      GEMINI_HEADLESS: "0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  gemini-state:

secrets:
  gemini_registry_key:
    file: ./registry.key
