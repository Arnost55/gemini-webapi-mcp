[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-webapi-mcp"
version = "1.0.0"
description = "MCP server for Google Gemini — free image generation and chat via browser cookies"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "AndyShaman" },
]
keywords = ["mcp", "mcp-server", "gemini", "google-gemini", "ai", "image-generation", "llm", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Audited 2026-10-14. Never follow upstream master implicitly: its web
    # protocol implementation changes without a release boundary.
    "gemini-webapi @ git+https://github.com/xob0t/Gemini-API.git@4402e5231760a1e85e28eb6cd0040ff302b764de",
    "mcp>=1.8,<2",
    "browser-cookie3>=0.20",
    "orjson>=3.9",
    "Pillow>=10.0",
    "numpy>=1.24",
    "curl-cffi>=0.14.0",
    "pydantic>=2.0",
    "cryptography>=43.0",
    "websockets>=12,<16",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
browser = ["playwright>=1.50"]

[project.scripts]
gemini-webapi-mcp = "gemini_webapi_mcp:main"
gemini-web-session = "gemini_webapi_mcp.session:main"
gemini-account-registry = "gemini_webapi_mcp.registry:main"
gemini-protocol-capture = "gemini_webapi_mcp.protocol_capture:main"

[project.urls]
Homepage = "https://github.com/AndyShaman/gemini-webapi-mcp"
Repository = "https://github.com/AndyShaman/gemini-webapi-mcp"
Issues = "https://github.com/AndyShaman/gemini-webapi-mcp/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_webapi_mcp"]
